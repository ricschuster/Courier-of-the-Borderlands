name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Validate the workflow files themselves. deploy.yml and release-please.yml
      # only run on push to main, so an error in them cannot surface until after
      # merge: #246 was a step-level `if:` reading the secrets context, which is
      # not available there. It went green, merged, and broke every subsequent
      # run on main. Runs before the Node steps so a bad workflow fails fast.
      # Pinned to a release binary and checksummed: no npm dependency, and no
      # third-party action in the path of a required check.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs the same unit suite as `npm test` and additionally enforces the
      # coverage thresholds on src/systems (see vite.config.ts). One run rather
      # than two: the coverage pass is a superset, so a separate `npm test` step
      # would only execute the same 842 tests again.
      - name: Test and coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Asked once, so the shards below do not each redo a full-history checkout to
  # answer the same question. Cheap: checkout plus one node call, no npm install.
  scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The scope check diffs against the base commit, which a shallow
          # checkout does not have.
          fetch-depth: 0

      - name: Decide whether the bundle can have changed
        id: scope
        # Passed as env, not interpolated into the shell: the branch name is
        # attacker-controllable and `${{ }}` in a run block is a script-injection
        # hole. The rule itself is unit-tested and fails open (see the script).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: node scripts/e2e-scope.mjs

  # The fast browser specs run on every PR and push. The full-arc playthrough
  # skips itself here (it is gated on RUN_ARC); the dedicated Arc workflow runs
  # it on merge to main and nightly.
  #
  # Sharded because this is the whole CI wait: 500 test-seconds of real-time
  # driving that cannot be made faster, only spread (#422). Three runners of two
  # workers rather than one runner of six: ubuntu-latest is 4 vCPU, and trap 4
  # documents the arc flaking under CI load, so over-subscribing a canvas game
  # would buy that flake for the whole suite.
  e2e-shard:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Let every shard report. Failing fast would hide whether a red run is one
      # broken spec or a suite-wide breakage.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      # Sharding triples the fixed setup cost, and the browser download is the
      # largest part of it (35s of a ~70s floor). Cached, that floor is what now
      # limits how much a fourth shard could buy, so it is worth paying for here
      # rather than in a follow-up.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser cache does not carry the apt packages it needs, and those
      # are not cacheable, so a cache hit still has to install them.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

  # Owns the required status check. A matrix job reports as `e2e (1)`, `e2e (2)`,
  # ... never as `e2e`, so sharding `e2e` directly would mean the required
  # context never appears and every PR blocks forever. This aggregator keeps the
  # name stable and shard-count-agnostic: changing the matrix above is a one-line
  # edit, not a branch-protection edit.
  #
  # `if: always()` because it must also report when the shards were skipped for
  # being out of scope. A skipped required check never reports a conclusion.
  e2e:
    needs: [scope, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Report the shard results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          IN_SCOPE: ${{ needs.scope.outputs.run }}
          # For a matrix, `result` is success only when every shard succeeded.
          SHARDS: ${{ needs.e2e-shard.result }}
        run: node scripts/e2e-verdict.mjs
